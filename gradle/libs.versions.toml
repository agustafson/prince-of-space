[versions]
archunit = "1.4.2"
assertj = "3.27.7"
# Keep aligned with NullAway (0.13.x targets Error Prone ~2.45; 2.49+ breaks NullAway at runtime).
eclipse-jdt = "4.34"
errorprone = "2.45.0"
errorprone-plugin = "5.1.0"
google-java-format = "1.27.0"
javaparser = "3.28.1"
jqwik = "1.9.3"
jspecify = "1.0.0"
junit = "6.0.3"
maven-resolver = "1.9.22"
mkdocs-build = "4.0.1"
nullaway = "0.13.4"
npm-prettier = "3.4.2"
npm-prettier-plugin-java = "2.6.6"
palantir-java-format = "2.71.0"
picocli = "4.7.7"
shadow = "9.4.1"
slf4j = "2.0.17"
spotbugs-annotations = "4.9.8"
spotbugs-gradle = "6.5.1"
spotless = "8.4.0"
spotless-lib = "4.5.0"
test-logger = "4.0.0"

[libraries]
# Keep entries alphabetically sorted by key.
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }
javaparser-core = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
maven-resolver-api = { module = "org.apache.maven.resolver:maven-resolver-api", version.ref = "maven-resolver" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
palantir-java-format = { module = "com.palantir.javaformat:palantir-java-format", version.ref = "palantir-java-format" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }
spotless-lib = { module = "com.diffplug.spotless:spotless-lib", version.ref = "spotless-lib" }
spotless-lib-extra = { module = "com.diffplug.spotless:spotless-lib-extra", version.ref = "spotless-lib" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
mkdocs-build = { id = "ru.vyarus.mkdocs-build", version.ref = "mkdocs-build" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-gradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger" }
