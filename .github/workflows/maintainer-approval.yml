name: Maintainer approval

# Trusted publisher of the protected `maintainer-approval` check. It runs only
# from the default branch: workflow_run jobs use the default-branch workflow
# file and can access secrets even when the triggering run could not, the
# scheduled reconciliation runs from the default branch, and workflow_dispatch
# needs write access and is further limited by the `maintainer-check`
# environment's deployment branch policy. Pull request lifecycle and review
# events arrive through the unprivileged collector workflow
# (.github/workflows/maintainer-approval-collector.yml), because
# pull_request_review runs the pull request's own workflow version in the
# untrusted merge-ref context and fork and Dependabot pulls receive no secrets
# at all. See .github/maintainer-check/README.md and TDR-031.

on:
  workflow_run:
    workflows: [Maintainer approval collector]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: 'Pull request number to evaluate'
        required: true
        type: number
  schedule:
    # Scheduled reconciliation: re-publishes the check for every open pull
    # request, so a failed or modified collector run cannot leave a stale
    # published success standing after an approval is withdrawn. GitHub may
    # delay or drop scheduled runs, so this complements — never replaces —
    # event-driven publication.
    - cron: '17 * * * *'

permissions: {}

jobs:
  # Unprivileged resolution only: no environment, no secrets, no checkout.
  # The collector's artifact is extracted into an isolated temporary
  # directory, never the workspace, so no artifact-supplied file can reach a
  # trusted checkout; only the validated integer is used.
  resolve:
    name: maintainer-approval-resolve
    runs-on: ubuntu-latest
    # Only react to collector runs that succeeded; failed collectors publish
    # nothing here, and the scheduled reconciliation closes that gap.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      numbers: ${{ steps.numbers.outputs.numbers }}
    permissions:
      pull-requests: read
      actions: read
    steps:
      - name: Read the collector's pull request record
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/collector-record

      - name: List the pull requests to publish
        id: numbers
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR: ${{ inputs['pull-request'] }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_run)
              number="$(tr -d '[:space:]' < "$RUNNER_TEMP/collector-record/pr-number")"
              case "$number" in
                ''|*[!0-9]*) echo "Invalid pull request number: '$number'" >&2; exit 1 ;;
              esac
              numbers="[$number]"
              ;;
            workflow_dispatch)
              numbers="[${DISPATCH_PR}]"
              ;;
            *)
              # Scheduled sweep: every open pull request, bounded at 100.
              numbers="$(gh api --paginate --slurp \
                "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
                | jq -c '[.[][] | .number] | sort | .[:100]')"
              ;;
          esac
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"

  # One shared publication job across every entry path — collector events,
  # dispatch reruns and the scheduled sweep — keyed by pull request number, so
  # evaluations of the same pull request serialize whatever path started them
  # and an older evaluation cannot publish over a newer revocation. The matrix
  # isolates each pull request: with fail-fast disabled, one failure never
  # skips the others, and any failed leg marks the run unsuccessful.
  publish:
    name: maintainer-approval-publisher
    needs: resolve
    if: ${{ needs.resolve.outputs.numbers != '' && needs.resolve.outputs.numbers != '[]' }}
    runs-on: ubuntu-latest
    environment: maintainer-check
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.numbers) }}
    concurrency:
      group: maintainer-approval-publish-${{ matrix.number }}
      cancel-in-progress: false
    permissions:
      # Read-only job token: pull request metadata, review pages and the
      # trusted checkout.
      pull-requests: read
      contents: read
    steps:
      - name: Fetch the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/${{ matrix.number }}" > "$RUNNER_TEMP/pr.json"

      - name: Fetch every review page
        id: reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --paginate walks every page; --slurp wraps the pages in one JSON
          # array of arrays, which publish.mjs flattens. A failed page is not
          # ignored: the check is published fail-closed and the job fails.
          if gh api --paginate --slurp \
              "repos/${{ github.repository }}/pulls/${{ matrix.number }}/reviews?per_page=100" \
              > "$RUNNER_TEMP/reviews.json"; then
            echo "unreadable=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not read every review page for pull request ${{ matrix.number }}; publishing a fail-closed result"
            echo "unreadable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check publisher configuration
        id: config
        env:
          APP_ID: ${{ vars.MAINTAINER_CHECK_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::warning::MAINTAINER_CHECK_APP_ID is not set; the maintainer-approval check is not configured. See .github/maintainer-check/README.md"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Executable scripts come only from the trusted publisher revision:
      # github.sha is the default-branch commit this workflow definition runs
      # from on workflow_run and schedule, and any dispatched ref outside the
      # environment's deployment policy is rejected before this step runs. A
      # pull request's base branch is never trusted — contributors can create
      # branches — so no pull request revision is ever executed here.
      - name: Check out the trusted publisher revision
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Mint the publisher app token
        if: steps.config.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.MAINTAINER_CHECK_APP_ID }}
          private-key: ${{ secrets.MAINTAINER_CHECK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Evaluate the maintainer policy and publish the check
        if: steps.config.outputs.configured == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_JSON: ${{ runner.temp }}/pr.json
          REVIEWS_JSON: ${{ runner.temp }}/reviews.json
          REVIEWS_UNREADABLE: ${{ steps.reviews.outputs.unreadable }}
        run: |
          set -euo pipefail
          node scripts/maintainer-check/publish.mjs
          if [ "${{ steps.reviews.outputs.unreadable }}" = "true" ]; then
            echo "::error::Review evidence could not be read for pull request ${{ matrix.number }}; this sweep is unsuccessful"
            exit 1
          fi
