name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
        include:
          - java-version: 17
            distribution: temurin
          - java-version: 21
            distribution: temurin
          - java-version: 25
            distribution: oracle

    # Keep these emitted check names in sync with .github/rulesets/main.json.
    name: "Java ${{ matrix.java-version }}"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

  vscode-extension:
    # Packages the VS Code extension with @vscode/vsce, which validates the
    # @types/vscode <= engines.vscode invariant that the Release workflow relies on.
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/vscode-extension/package-lock.json

      - name: Compile, test, and validate package
        working-directory: modules/vscode-extension
        run: |
          npm ci
          npm run compile
          npm test
          npx --yes @vscode/vsce@3 package --out prince-of-space-vscode-ci.vsix
