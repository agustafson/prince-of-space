# Full matrix (3 line lengths × 3 wrap styles per corpus). Heavy: scheduled / manual only.
# Not triggered on pull_request so branch protection + Dependabot auto-merge are not blocked by
# skipped or missing full-matrix checks on routine PRs (see external-eval-smoke.yml).
#
# Eval result dedupe: .github/actions/eval-external-corpus (same keys as release workflow).

name: External eval full

on:
  schedule:
    # Weekly full matrix; each job is one (corpus × line length × wrap style).
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: external-eval-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-eval-full:
    name: External eval full (${{ matrix.corpus }} w${{ matrix.line_length }} ${{ matrix.wrap_style }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 80
            wrap_style: wide
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 80
            wrap_style: balanced
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 80
            wrap_style: narrow
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 100
            wrap_style: wide
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 100
            wrap_style: balanced
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 100
            wrap_style: narrow
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 120
            wrap_style: wide
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 120
            wrap_style: balanced
          - corpus: spring-framework
            repository: spring-projects/spring-framework
            line_length: 120
            wrap_style: narrow
          - corpus: guava
            repository: google/guava
            line_length: 80
            wrap_style: wide
          - corpus: guava
            repository: google/guava
            line_length: 80
            wrap_style: balanced
          - corpus: guava
            repository: google/guava
            line_length: 80
            wrap_style: narrow
          - corpus: guava
            repository: google/guava
            line_length: 100
            wrap_style: wide
          - corpus: guava
            repository: google/guava
            line_length: 100
            wrap_style: balanced
          - corpus: guava
            repository: google/guava
            line_length: 100
            wrap_style: narrow
          - corpus: guava
            repository: google/guava
            line_length: 120
            wrap_style: wide
          - corpus: guava
            repository: google/guava
            line_length: 120
            wrap_style: balanced
          - corpus: guava
            repository: google/guava
            line_length: 120
            wrap_style: narrow
    steps:
      - name: Checkout Prince of Space
        uses: actions/checkout@v7

      - name: Eval external corpus (full matrix, cached)
        uses: ./.github/actions/eval-external-corpus
        with:
          corpus: ${{ matrix.corpus }}
          repository: ${{ matrix.repository }}
          line_length: ${{ matrix.line_length }}
          wrap_style: ${{ matrix.wrap_style }}

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-full-${{ matrix.corpus }}-${{ matrix.line_length }}-${{ matrix.wrap_style }}-${{ github.sha }}
          path: docs/eval-results/*.md
          if-no-files-found: ignore
