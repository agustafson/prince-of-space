name: Sync README coordinates

concurrency:
  group: readme-updates-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    paths:
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_ACTIONS_PUSH_TOKEN || github.token }}

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: syncReadmeVersions
        env:
          RUN_README_SYNC: "true"
        run: ./gradlew syncReadmeVersions --no-daemon

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No README coordinate changes."
          else
            git commit -m "chore: sync README coordinates [skip ci]"
            git push
          fi
